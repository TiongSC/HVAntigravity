<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happening Vibe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/modal.css">
</head>

<body>
    <div id="app">
        <!-- Navigation / Header -->
        <header class="main-header">
            <h1 class="logo">Happening Vibe</h1>
            <div class="user-controls" id="userControls">
                <!-- Injected via JS -->
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="calendar-controls">
                <button id="prevMonth" class="nav-btn">&lt;</button>
                <h2 id="currentMonthYear"></h2>
                <button id="nextMonth" class="nav-btn">&gt;</button>
            </div>

            <div class="calendar-container">
                <div class="calendar-header">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="calendarGrid" class="calendar-grid">
                    <!-- Days injected via JS -->
                </div>
            </div>
        </main>

        <!-- Modals -->
        <div id="authModal" class="modal hidden">
            <div class="modal-content glass">
                <span class="close-btn">&times;</span>
                <div id="authForms"></div>
            </div>
        </div>

        <div id="eventModal" class="modal hidden">
            <div class="modal-content glass">
                <span class="close-btn">&times;</span>
                <div id="eventDetails"></div>
            </div>
        </div>

        <div id="createEventModal" class="modal hidden">
            <div class="modal-content glass">
                <span class="close-btn">&times;</span>
                <form id="createEventForm">
                    <h2>Create Vibe</h2>
                    <input type="text" id="eventTitle" placeholder="Event Topic (Max 3 words)" maxlength="30" required>
                    <textarea id="eventDescription" placeholder="Description (Max 200 chars)" maxlength="200"
                        required></textarea>
                    <div class="date-group">
                        <label>From: <input type="date" id="eventStartDate" required
                                onclick="this.showPicker()"></label>
                        <label>To: <input type="date" id="eventEndDate" required onclick="this.showPicker()"></label>
                    </div>
                    <div class="time-group">
                        <label>Start: <input type="time" id="eventStartTime" required
                                onclick="this.showPicker()"></label>
                        <label>End: <input type="time" id="eventEndTime" required onclick="this.showPicker()"></label>
                    </div>
                    <button type="submit" class="cta-btn">Post Vibe</button>
                    <div id="eventError" class="error-msg"></div>
                </form>
            </div>
        </div>

        <div id="confirmationModal" class="modal hidden" style="z-index: 2000;">
            <div class="modal-content glass" style="text-align:center; max-width:350px;">
                <h2 style="margin-bottom:10px; color:var(--color-primary);">Delete Vibe?</h2>
                <p style="margin-bottom:20px; color:#ddd;">Are you sure you want to delete this event?</p>
                <div style="display:flex; justify-content:space-between; gap:10px;">
                    <button id="cancelDeleteBtn" class="secondary-btn" style="flex:1;">Cancel</button>
                    <button id="confirmDeleteBtn" class="cta-btn" style="flex:1; background: #ff4444;">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js?v=9"></script>
</body>

</html>
